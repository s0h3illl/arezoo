# Production stack.
#
#   cp .env.production.example .env.production
#   # edit it: APP_KEY, APP_URL, DOMAIN, CERT_PATH, DB_PASSWORD, mail credentials
#   docker compose --env-file .env.production -f compose.production.yaml build
#   docker compose --env-file .env.production -f compose.production.yaml up -d
#   docker compose --env-file .env.production -f compose.production.yaml exec app php artisan migrate --force
#
# Differences from compose.yaml, and why each one is there:
#
#   - No Vite service. Production serves the compiled files in public/build, which
#     the image was built with. A dev server in production would hand visitors
#     unminified, unversioned source and an open websocket to anyone who asked.
#
#   - nginx rather than Caddy. Caddy obtained and renewed its own certificate,
#     which was the reason to choose it; that job now belongs to certbot on the
#     host, and nginx terminates TLS directly. See docs/deployment.md.
#
#   - One nginx rather than a proxy in front of one. There is no longer a second
#     language in the path, so there is nothing for a bridging container to
#     translate: this one speaks HTTP to the browser and FastCGI to php-fpm.
#
#   - No bind mount of the working tree. The image is the release. The exceptions
#     are the certificate, the ACME webroot and storage/, all of which have to
#     survive a deploy.
#
#   - Migrations are not automatic. See docker/app/entrypoint-production.sh.
#
#   - The database is not published to the host. It is reachable only from this
#     network, so a mistaken bind to 0.0.0.0 cannot expose it.

# A different Compose project name from compose.yaml, and not a cosmetic choice.
#
# Docker namespaces named volumes by project, so with both files saying `name: arezoo`
# they would share arezoo_mariadb-data. Bringing this stack up on a laptop with the
# development one stopped would then open the development database, and the first
# `migrate --force` would run against it. A separate name makes that impossible
# rather than merely unlikely, and it is also what keeps production volumes readable
# on the server.
name: arezoo-prod

services:
  # The front door: TLS, the compiled front end, and the bridge to php-fpm.
  #
  # Not two containers, as it once was. Caddy spoke HTTP and php-fpm speaks FastCGI,
  # so a proxy in front of a bridging nginx existed only to translate between them.
  # With nginx terminating TLS itself there is nothing left to translate, and the
  # extra hop is gone with it.
  nginx:
    image: arezoo-prod-web
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Read from the environment so the hostname is never committed, and so a first
      # deploy to a new domain is a change to .env.production rather than a commit.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      # The directory holding fullchain.pem and privkey.pem, which is the certbot
      # directory named after the first name on the certificate. Kept as a path
      # rather than a name so the template does not have to know how certbot
      # arranges its live/ tree.
      CERT_PATH: ${CERT_PATH:?set CERT_PATH in .env.production}

      # Which ${VARS} in the template nginx's entrypoint substitutes.
      #
      # Without this it substitutes every environment variable it can see, which
      # includes $host, $scheme, $uri and every other nginx variable in the file —
      # all of them replaced with an empty string. This restricts it to the two
      # names above, so the nginx variables survive intact.
      NGINX_ENVSUBST_FILTER: '^(DOMAIN|CERT_PATH)$'
    ports:
      - '80:80'
      - '443:443'
      # 443/udp is QUIC. It is a genuine speed win and a genuine complication: some
      # networks drop UDP, and a client that has a QUIC path it cannot use falls
      # back to TCP. Leaving it off costs a little latency and removes the question.
    volumes:
      # The certificate, read-only. The container never writes it; certbot runs on
      # the host and a deploy-hook reloads this container once it has renewed.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Where certbot answers ACME challenges from, so that renewal needs neither a
      # stopped web server nor a published port 80 on a second container. Read-only
      # for the same reason as the certificate above.
      - /var/www/certbot:/var/www/certbot:ro
      # Read-only, and the same volume the app writes to. Read-only is deliberate:
      # this container has no reason to modify an upload, and if it were
      # compromised the one thing it could not then do is change what the
      # application serves.
      - app-storage:/var/www/html/storage/app:ro

  app:
    # Named explicitly, and deliberately not `arezoo-app`. Compose otherwise derives
    # the tag from the service name, which is identical in both files, and a
    # production build would land on top of the development image and leave a
    # container running the wrong target with nothing in the output to say so.
    image: arezoo-prod-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Compose's own interpolation does not read env_file, so anything referenced
      # with ${...} below has to be repeated here or it silently expands to empty.
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: '3306'
    volumes:
      # Uploads. Avatars and wish images live on the public disk, and they are the
      # one thing in this stack that a new image cannot recreate: baking them into
      # the image would mean losing every user's picture on each deploy. Named
      # rather than bind-mounted so that `docker compose down -v` is a deliberate
      # way to lose them.
      - app-storage:/var/www/html/storage/app
    healthcheck:
      # A socket on 9000 means the entrypoint finished: dependencies installed,
      # config compiled, and the front-end manifest found. This is what nginx waits
      # for before serving anything.
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Not started by `up`. Enabled with `--profile queue`.
  #
  # Nothing in this application implements ShouldQueue, so this service has nothing
  # to do. It is a profile rather than a deletion because the first job that does
  # would otherwise be a production incident rather than a configuration change —
  # and because on a host that also runs a mail server, the memory it sits on is
  # better spent there.
  queue:
    image: arezoo-prod-app
    profiles: ['queue']
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: '3306'
    volumes:
      - app-storage:/var/www/html/storage/app
    # No entrypoint: it compiles config caches, and two processes writing the same
    # cache files at once is a race. The app container has already done it, and this
    # service shares the image.
    entrypoint: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=90', '--sleep=3']

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-arezoo}
      MARIADB_USER: ${DB_USERNAME:-arezoo}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Not started by `up`. Enabled with `--profile mail` while setting up, to read
  # verification and reset mail in a browser before a real provider exists.
  #
  # It is deliberately not part of the default production start: on a live site this
  # is an open SMTP relay on a public port, and mail that is delivered to it instead
  # of to a real recipient is mail that looks sent and arrives nowhere.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ['mail']
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: '1000'
    volumes:
      - mailpit-data:/data

volumes:
  app-storage:
  mariadb-data:
  mailpit-data:
