; Upload limits for the development stack.
;
; PHP's 2M default is the wish cover's advertised ceiling, which leaves no room at
; all for multipart overhead — a thumbnail a kilobyte under the cap is still
; rejected. nginx is given the same figure in docker/nginx/default.conf, because
; whichever limit is lower is the one that applies.

upload_max_filesize = 12M
post_max_size = 12M

; A photograph is resized and re-encoded client-side before it is sent, so there is
; never a large body waiting on a slow disk.
memory_limit = 512M

; Realpath cache, and OPcache.
;
; The container's filesystem is a bind mount, so the framework resolves an unusually
; large number of paths it has already seen — vendor's autoloader, every config
; file, every Blade view — and each miss is a stat() against the host's disk.
;
; OPcache matters more here than it would on a local install for the same reason.
;
; Do not "fix" the Dockerfile by adding opcache to docker-php-ext-install: it is
; already built into php:8.5-fpm as a Zend extension, which is why that command
; fails on it with `cp: cannot stat 'modules/*'`. `php -m` lists it under
; [Zend Modules], and the settings below are all that is needed to switch it on.
;
; validate_timestamps stays on, and revalidate_freq at 0, so a file edited on the
; host is picked up on the very next request. An OPcache that ignored edits would
; be worse than none at all in development.
realpath_cache_size = 4096K
realpath_cache_ttl = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
