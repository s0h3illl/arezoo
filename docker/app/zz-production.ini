; Overrides docker/app/php.ini in the production image.
;
; The two settings below are the difference between a development php.ini and a
; production one. Everything in the development file stays — upload ceilings,
; timeouts, the SMTP bound — because none of it is about being a development
; server; it is about being a web server.

opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16

; Every request in development re-reads the PHP files on disk, because a file
; changing between two requests is the entire point. In production nothing
; changes without a new image, so the check is pure overhead — and not small
; overhead, since it is a stat() per file per request.
;
; validate_timestamps=0 is only safe *because* of that. It is what makes a stale
; opcode cache a real risk: if a deploy does not restart php-fpm, the container
; keeps running the previous release's code while reporting a new version. The
; production entrypoint therefore clears the cache on start, so a fresh process
; always begins with a fresh cache.
opcache.validate_timestamps=0
opcache.enable_cli=0

; Errors belong in the log, not in the response. With APP_DEBUG=false this is
; already Laravel's behaviour; display_errors=0 is what stops a PHP-level notice
; from reaching the browser in a container where PHP's own defaults are not
; curated for production.
display_errors=0
log_errors=1
error_log=/dev/stderr

; The header a client sees has to cover the real protocol. The reverse proxy
; terminates TLS, so the request reaching php-fpm is plain HTTP — which is why
; trustProxies() in bootstrap/app.php exists. These are just sizes.
post_max_size=12M
upload_max_filesize=12M
memory_limit=512M
max_execution_time=60

realpath_cache_size=4096K
realpath_cache_ttl=600
