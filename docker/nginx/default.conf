# The application server for the development stack.
#
# The document root is the working tree's public/ directory, bind-mounted at the
# same absolute path as in the app container. That sameness is deliberate: uploads
# land in storage/app/public and are served through the relative public/storage
# symlink, and a relative link only resolves the same way in both containers if both
# of them are looking at the same path.

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Matches upload_max_filesize / post_max_size in docker/app/php.ini. Whichever
    # of the two is lower is the one that actually applies, so the three agree.
    client_max_body_size 12M;

    # Inertia owns the history of this application: a page URL must reach the
    # framework so it can answer with the right page component, and anything
    # genuinely missing must fall through to index.php rather than to nginx's own
    # 404, which is a bare page outside the app's Persian layout and error page.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # $realpath_root rather than $document_root: the latter is the value the
        # `root` directive holds, un-expanded, and PHP would not find the file.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # The same value the framework logs, so a line in storage/logs names the
        # request the way nginx sees it.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_read_timeout 60;
    }

    # Dotfiles, with the exception of .well-known, which browsers are allowed to
    # reach — that is where a TLS certificate's ACME challenge lives.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
