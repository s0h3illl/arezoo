# The application server for the production stack.
#
# This file exists because Caddy cannot talk to php-fpm. Caddy's reverse_proxy
# speaks HTTP; php-fpm speaks FastCGI. Pointing Caddy straight at the app's port
# 9000 produces a connection that is established and then discarded, and the
# symptom is a 502 with nothing useful in either log. Bridging the two is this
# container's whole job: Caddy -> nginx -> php-fpm.
#
# Caddy keeps the job it is good at — TLS, and obtaining and renewing the
# certificate — and nginx keeps the job it is good at.

# Which scheme to tell the application about.
#
# The obvious line here is `fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;`, and
# it is wrong. $scheme is the scheme between *this* container and its caller, and
# that hop is plain http because Caddy-to-nginx is internal. Passing $scheme would
# tell Laravel that every request arrived over http even though the browser used
# https, and the consequences are quiet rather than loud: signed URLs in
# password-reset mail would be built with an http:// host, which mail clients and
# browsers then treat as untrusted or refuse to open.
#
# So the header Caddy set is passed through instead, falling back to $scheme only
# when there is none. Trusting it is safe here: this port is not published to the
# host, so the only client that can reach it is Caddy, and Caddy overwrites
# X-Forwarded-Proto with the real scheme of the request it received rather than
# appending to whatever a visitor sent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Matches upload_max_filesize and post_max_size in docker/app/zz-production.ini.
    # Whichever of the three is lowest is the one that applies, so all three agree.
    client_max_body_size 12M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Static assets. Vite fingerprints these filenames, so a given URL's contents
    # can never change — a year-long immutable cache is safe, and the reason a
    # deploy is not visible to returning visitors until they reload.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # A visitor's own uploads. The same fingerprinting does not apply, so this is
    # capped at a day rather than a year, or a replaced image would be served from
    # cache long after it changed.
    location /storage/ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Inertia owns this application's history: a page URL has to reach the
    # framework so it can answer with the right page component, and anything
    # genuinely missing must fall through to index.php rather than to nginx's own
    # 404, which would be a bare page outside the app's Persian layout.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Never cached. This is the whole application, and caching it would serve one
    # visitor's page to the next.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_read_timeout 60;
    }

    location ~ \.php$ {
        # A .php file anywhere else is a request for a script that should never be
        # reached over HTTP. Refused rather than executed, so that a file which
        # somehow lands outside public/ cannot be run by URL.
        return 404;
    }

    # Dotfiles. .well-known is exempt because that is where a TLS certificate's
    # ACME challenge lives.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
