# The development stack: everything this application needs to be run, mail included.
#
#   docker compose up -d --build
#   open http://localhost:8000          the application
#   open http://localhost:8025          every email the application has sent
#
# The working tree is bind-mounted into every service that needs the code, rather than
# copied into it, so an edit on the host is an edit in the containers and a `git pull`
# that changes a lockfile is picked up on the next start. Only dependencies live in
# named volumes, which is what keeps root-owned package trees out of the repository.

name: arezoo

services:
  mariadb:
    # MariaDB rather than MySQL. Both speak the same wire protocol, so the pdo_mysql
    # extension in the application image is correct for this and was never the thing
    # to change. The schema is plain — no generated columns, no fulltext, no JSON
    # path operators, and the single json column (passkeys.credential) is read whole
    # and cast — so it runs unmodified here, and MariaDB's markedly smaller idle
    # footprint is worth having on a development machine.
    image: mariadb:11.4
    restart: unless-stopped
    # utf8mb4 is what makes a Persian name in a bio, or a Persian message on a
    # contribution, storable at all — utf8's three-byte limit would truncate them.
    # Note that MariaDB 10.10+ would give us uca1400_ai_ci here, which collates
    # Persian better than utf8mb4_unicode_ci does; the application pins the older
    # name in config/database.php, and pinning it here keeps the two in agreement.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-arezoo}
      MARIADB_USER: ${DB_USERNAME:-arezoo}
      MARIADB_PASSWORD: ${DB_PASSWORD:-arezoo}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # The image's own script, which is why the password can come from the
      # environment instead of being interpolated into this file — and why it also
      # reports ready only once InnoDB has finished initialising, which a bare port
      # check would call healthy far too early.
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      # 1025 is where the application hands over its mail; 8025 is where a person
      # reads it. Both are Mailpit's own defaults, which is why .env.example can
      # name the same two numbers the image listens on.
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '1000'
      TZ: ${TZ:-UTC}
    # The image ships its own healthcheck (`/mailpit readyz`), and the `depends_on`
    # below is what makes that healthcheck mean something: the application waits for
    # a service that will actually accept its mail.

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    # Bounded, unlike the long-running services below. This container's start is a
    # multi-step job — install, key, link, migrate — and a step that fails on the
    # data (a migration the database cannot accept) will fail identically on every
    # retry. An unbounded restart loop would bury the one log line that explains why
    # under a hundred copies of itself.
    restart: on-failure:5
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_LOCALE: fa
      # Laravel's dotenv loader never overwrites a real environment variable, so
      # these win over .env — and .env keeps working, untouched, for anyone running
      # the application outside Docker against SQLite.
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_DATABASE: ${DB_DATABASE:-arezoo}
      DB_USERNAME: ${DB_USERNAME:-arezoo}
      DB_PASSWORD: ${DB_PASSWORD:-arezoo}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '${MAILPIT_SMTP_PORT:-1025}'
      # The sender's identity is deliberately absent here. Where the mail goes is a
      # property of this stack; who it claims to be from is not, and .env already
      # states that for every environment. Pinning it here too would be a trap worth
      # naming: `${MAIL_FROM_NAME:-SomeDefault}` would not pin SomeDefault, because
      # Compose resolves ${MAIL_FROM_NAME} from the project .env before a default is
      # ever considered — leaving a default that reads as deliberate and can never
      # apply.
      # Read by tests/Feature/MailServiceTest.php, which proves delivery by asking
      # the service what it received rather than by trusting that nothing threw.
      MAILPIT_API_URL: http://mailpit:${MAILPIT_UI_PORT:-8025}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: '${MAILPIT_SMTP_PORT:-1025}'
      # The Inertia SSR server is started by the asset container, so from here it is
      # reachable by service name rather than by the loopback address
      # config/inertia.php defaults to.
      INERTIA_SSR_URL: http://vite:${VITE_SSR_PORT:-13714}
      LOG_CHANNEL: single
      QUEUE_CONNECTION: database
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    healthcheck:
      # "Can this container serve a request", and nothing narrower. php-fpm is
      # exec'd as the entrypoint's last step, so a socket on 9000 is only reachable
      # once install, key, storage link and migrate have all already succeeded —
      # which is exactly the dependency the queue service below needs, without that
      # check having to re-derive the migration state and depend on the output
      # wording of an artisan command.
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_DATABASE: ${DB_DATABASE:-arezoo}
      DB_USERNAME: ${DB_USERNAME:-arezoo}
      DB_PASSWORD: ${DB_PASSWORD:-arezoo}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '${MAILPIT_SMTP_PORT:-1025}'
      QUEUE_CONNECTION: database
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    # The app entrypoint is deliberately bypassed rather than run twice: the
    # `service_healthy` gate above means vendor/, the .env key and the schema are
    # already in place, and a second `migrate --force` in parallel with the first is
    # exactly the kind of race a database does not need.
    entrypoint: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=90', '--verbose']

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: vite
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The dev server binds every interface because its port is published, and
      # advertises an origin because the address it binds is not the one the browser
      # can use. Those are different addresses and the distinction is the whole point:
      # the origin is what ends up in the hot file, and the browser then requests
      # every asset from it. Set to the app's URL it would ask the application for
      # @vite/client, get a 404, and load no JavaScript at all.
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_PORT: ${VITE_DEV_SERVER_PORT:-5173}
      VITE_DEV_SERVER_ORIGIN: http://localhost:${VITE_DEV_SERVER_PORT:-5173}
    ports:
      - '${VITE_DEV_SERVER_PORT:-5173}:${VITE_DEV_SERVER_PORT:-5173}'
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - node-modules:/var/www/html/node_modules

  # Not started by `docker compose up` — it sits behind the `test` profile so that
  # running the suite is always a deliberate act:
  #
  #   docker compose --profile test run --rm tests
  #
  # Its own service rather than a set of flags on `app`, because of a trap that is
  # easy to fall into and expensive to notice. phpunit.xml asks for an in-memory
  # SQLite database, but PHPUnit treats its <env> entries as defaults and will not
  # overwrite a variable that is already set — and the app service supplies
  # DB_CONNECTION=mariadb as a real environment variable. Run the suite through the
  # app container and RefreshDatabase quietly runs migrate:fresh against the
  # development database: the schema is dropped and rebuilt under the running
  # application, the queue worker dies polling a table that is momentarily gone, and
  # anything the developer had entered is gone with it. This service cannot be
  # configured that way by accident.
  tests:
    profiles: ['test']
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    depends_on:
      # For vendor/ and the .env key, both of which the app container prepares. The
      # entrypoint below is bypassed so that preparing the tree is not repeated.
      app:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      APP_ENV: testing
      # Restated rather than left to phpunit.xml, for the reason above. The queue is
      # synchronous so that a notification is sent during the request that triggers
      # it; a database queue would hand the message to a worker that cannot see an
      # in-memory database, and the suite would assert on a mailbox that is empty for
      # reasons that have nothing to do with mail.
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '${MAILPIT_SMTP_PORT:-1025}'
      MAILPIT_API_URL: http://mailpit:${MAILPIT_UI_PORT:-8025}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: '${MAILPIT_SMTP_PORT:-1025}'
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    entrypoint: []
    command: ['php', 'artisan', 'test']

volumes:
  mariadb-data:
  mailpit-data:
  vendor-data:
  node-modules: